<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="대구 소상공인을 위한 데이터 기반 경영·금융 도우미 iM파트너 시작 화면">
  <title>로그인 | iM파트너</title>
  <link rel="icon" type="image/x-icon" href="../assets/brand/im-bank-favicon.ico">
  <link rel="stylesheet" href="../assets/fonts/noto-sans-kr.css">
  <link rel="stylesheet" href="./login.css">
</head>
<body id="top">
  <a class="skip-link" href="#accessCard">로그인 영역으로 이동</a>

  <header class="guest-header">
    <div class="header-inner">
      <a class="brand" href="#top" aria-label="iM파트너 시작 화면">
        <span class="brand-mark" aria-hidden="true"><img src="../assets/brand/im-bank-symbol.png" alt=""></span>
        <span class="brand-name"><span>iM</span><strong>파트너</strong></span>
      </a>
      <a class="header-demo" id="headerDemoLink" href="../main-screen.html#dashboard">데모시작</a>
    </div>
  </header>

  <main class="guest-main">
    <section class="guest-shell" aria-labelledby="guestTitle">
      <div class="value-panel">
        <div class="value-copy">
          <p class="eyebrow">소상공인 경영·금융 도우미</p>
          <h1 id="guestTitle">내 가게의 흐름을<br><strong>오늘의 행동으로</strong></h1>
          <p class="lead">매출부터 운영 전략까지<br>내 가게에 필요한 정보를 한곳에서 확인하세요.</p>

          <ul class="feature-list" aria-label="주요 서비스">
            <li><span aria-hidden="true">01</span><strong>매출진단</strong><small>매출·지출과 상권 흐름을 한눈에 확인하세요.</small></li>
            <li><span aria-hidden="true">02</span><strong>회복전략</strong><small>우리 가게에 필요한 운영 개선 방향을 찾아보세요.</small></li>
            <li><span aria-hidden="true">03</span><strong>iM비서</strong><small>경영 질문부터 분석 보고서까지 간편하게 확인하세요.</small></li>
          </ul>
        </div>

      </div>

      <section class="access-card" id="accessCard" aria-labelledby="accessTitle" tabindex="-1">
        <div class="access-heading">
          <h2 id="accessTitle">아이디 로그인</h2>
        </div>


        <div class="login-form" id="loginForm" role="form" aria-labelledby="accessTitle">

          <label class="field" for="userId">
            <span>아이디</span>
            <input id="userId" type="text" maxlength="40" placeholder="아이디를 입력해 주세요" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="loginStatus">
          </label>

          <label class="field" for="userPassword">
            <span>비밀번호</span>
            <span class="password-field">
              <input id="userPassword" type="password" maxlength="64" placeholder="비밀번호를 입력해 주세요" autocomplete="off" aria-describedby="loginStatus">
              <button class="password-toggle" id="passwordToggle" type="button" aria-pressed="false">보기</button>
            </span>
          </label>

          <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
          <button class="login-button" id="loginButton" type="button"><span>로그인</span></button>
          <noscript><p class="login-status error">로그인 화면을 이용하려면 JavaScript를 켜 주세요.</p></noscript>
        </div>

      </section>
    </section>
  </main>

  <script src="./login.js"></script>
</body>
</html>
